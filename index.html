<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #14263f;
            color:#ffffff;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 3rem;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from {

                transform: translateY(30px);

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
